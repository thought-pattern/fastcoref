[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 132
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "N811", "UP038"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["fastcoref"]

[tool.black]
line-length = 132
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 132
combine_as_imports = true
force_sort_within_sections = true
known_first_party = ["fastcoref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:jaxtyping"

[tool.pyright]
include = ["fastcoref", "setup.py", "tests"]
# Resolve fastcoref.fastcoref from the parent checkout, as Tapestry does.
executionEnvironments = [{ root = ".." }]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportImportCycles = "error"

[tool.vulture]
paths = ["fastcoref", "setup.py", "tests"]
min_confidence = 65
ignore_names = ["exc_type", "exc_value", "traceback", "unused_*"]

[tool.bandit]
exclude_dirs = ["/.venv/", "/build/", "/dist/"]
