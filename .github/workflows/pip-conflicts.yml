name: Check Pip Conflicts

on:
  pull_request:
    paths:
      - "requirements.txt"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/pip-conflicts.yml"
  push:
    branches: [develop, main]
    paths:
      - "requirements.txt"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/pip-conflicts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-conflicts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pip-conflicts:
    name: Resolve requirements.txt and setup.py
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: python -m pip install pip-tools

      - name: Check requirements.txt for conflicts
        run: |
          echo "Resolving requirements.txt..."
          if pip-compile requirements.txt \
              --dry-run \
              --quiet \
              --no-header \
              --strip-extras \
              --output-file=- > resolution.log 2>&1; then
            echo "No conflicts found in requirements.txt"
          else
            echo "::error file=requirements.txt::Dependency conflicts detected in requirements.txt"
            grep -E "ERROR|conflict|ResolutionImpossible|requires|depends on" resolution.log || cat resolution.log
            exit 1
          fi

      - name: Check setup.py compatibility with requirements.txt
        run: |
          echo "Resolving setup.py with requirements.txt..."
          if pip-compile setup.py requirements.txt \
              --dry-run \
              --quiet \
              --no-header \
              --strip-extras \
              --output-file=- > combined-resolution.log 2>&1; then
            echo "No conflicts found between setup.py and requirements.txt"
          else
            echo "::error file=setup.py::Dependency conflicts detected between setup.py and requirements.txt"
            grep -E "ERROR|conflict|ResolutionImpossible|requires|depends on" combined-resolution.log || cat combined-resolution.log
            exit 1
          fi
