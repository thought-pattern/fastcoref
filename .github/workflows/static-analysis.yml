name: Static Analysis

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "setup.py"
      - "requirements.txt"
      - ".github/workflows/static-analysis.yml"
  push:
    branches: [develop, main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "setup.py"
      - "requirements.txt"
      - ".github/workflows/static-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-security:
    name: Lint and Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: python -m pip install --upgrade bandit isort ruff vulture

      - name: Import-order check
        run: isort --check-only fastcoref setup.py tests

      - name: Run Ruff
        run: ruff check fastcoref setup.py tests

      - name: Bytecode compilation check
        run: python -m compileall -q fastcoref setup.py tests

      - name: Security scan
        run: python -m bandit --configfile pyproject.toml -q -ii -lll -r fastcoref

      - name: Dead-code scan
        run: python -m vulture

  typecheck-and-smoke:
    name: Pyright and Import Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies and package metadata
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Verify runtime and setup.py dependency compatibility
        run: python -m pip check

      - name: Install type-checking and test dependencies
        run: python -m pip install pyright==1.1.411 pytest

      - name: Verify combined dependency compatibility
        run: python -m pip check

      - name: Run Pyright
        run: python -m pyright

      - name: Verify runtime package imports
        run: |
          ln -sfn "$PWD" "$RUNNER_TEMP/fastcoref"
          PYTHONPATH="$RUNNER_TEMP" python -P -c "from fastcoref.fastcoref.modeling import CorefResult, FCoref, LingMessCoref"
